<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>plantqa — P&amp;ID + datasheet Q&amp;A</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Segoe UI, Arial, sans-serif; font-size: 14px; color: #1d2733; }
  header { padding: 8px 14px; background: #1f3a5f; color: #fff; display: flex; gap: 16px; align-items: baseline; }
  header h1 { font-size: 17px; margin: 0; }
  header span { font-size: 12px; opacity: .85; }
  main { display: grid; grid-template-columns: 58% 42%; height: calc(100vh - 38px); }
  #left { border-right: 1px solid #c8d1dc; display: flex; flex-direction: column; }
  #left .bar { padding: 6px 10px; background: #eef2f6; font-size: 12px; display: flex; gap: 10px; align-items: center; }
  #viewer { flex: 1; overflow: auto; background: #f4f6f8; text-align: center; }
  #viewer img { max-width: 100%; margin: 8px auto; box-shadow: 0 1px 4px rgba(0,0,0,.15); background: #fff; }
  .sheet { padding: 2px 8px; font-size: 12px; cursor: pointer; }
  #right { padding: 12px 14px; overflow-y: auto; }
  textarea { width: 100%; height: 70px; font: inherit; padding: 6px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  select, button { font: inherit; padding: 4px 8px; }
  button.primary { background: #1f3a5f; color: #fff; border: 0; border-radius: 3px; padding: 6px 14px; cursor: pointer; }
  .answer { margin-top: 12px; padding: 10px; background: #f5f8fb; border-left: 4px solid #1f3a5f; white-space: pre-wrap; }
  .meta { font-size: 12px; color: #4d5b6a; margin-top: 6px; }
  .tag { display: inline-block; padding: 1px 6px; margin: 2px; border-radius: 9px; background: #dde6f0; font-size: 12px; }
  pre { background: #1d2733; color: #e8eef5; padding: 8px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
  details { margin-top: 8px; }
  #examples button { display: block; text-align: left; width: 100%; margin: 2px 0; background: #fff; border: 1px solid #d5dde6; cursor: pointer; font-size: 12px; }
  .fam { font-weight: 600; color: #1f3a5f; }
  a { color: #1f5fa8; }
</style>
</head>
<body>
<header><h1>plantqa</h1><span>Ask anything about the example plant: the P&amp;ID (left) and the datasheet of every tagged item.</span></header>
<main>
  <section id="left">
    <div class="bar"><b>P&amp;ID</b> corpus PQA (plantgraph, seed 6) · sheet
      <button class="sheet" data-s="1">1</button><button class="sheet" data-s="2">2</button>
      <button class="sheet" data-s="3">3</button><button class="sheet" data-s="4">4</button>
      <a href="/api/drawing" target="_blank">PDF</a>
      <span id="where"></span></div>
    <div id="viewer"><img id="pic" src="/api/drawing/1.png" alt="P&amp;ID sheet"></div>
  </section>
  <section id="right">
    <textarea id="q" placeholder="e.g. What is the maximum casing pressure of P-1-3?"></textarea>
    <div class="row">
      <label>Method <select id="method">
        <option value="M1">M1 — one graph, one query (extended cascade)</option>
        <option value="M2">M2 — router (cascade + datasheet A2)</option>
        <option value="M3">M3 — baseline (whole drawing + retrieved datasheet text)</option>
      </select></label>
      <label>Model <select id="model"></select></label>
      <label>Answer as <select id="atype">
        <option>FREE_TEXT</option><option>TAG_SET</option><option>TAG</option><option>TAG_PATH</option>
        <option>BOOLEAN</option><option>COUNT</option><option>UNIT_ID</option><option>CLASS_NAME</option>
      </select></label>
      <button class="primary" id="ask">Ask</button>
    </div>
    <div class="meta" id="default"></div>
    <div id="out"></div>
    <details open><summary>Example questions (dev set)</summary><div id="examples"></div></details>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let config = null;

function esc(s) { return String(s).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c])); }

function showSheet(n) { $("pic").src = `/api/drawing/${n}.png`; $("where").textContent = ""; }
function showPage(doc, page) {
  $("pic").src = `/api/datasheets/${doc}/page/${page}.png`;
  $("where").innerHTML = ` · showing ${esc(doc)} p. ${page} (<a href="/api/datasheets/${doc}/pdf#page=${page}" target="_blank">PDF</a>)`;
}
document.querySelectorAll(".sheet").forEach(b => b.onclick = () => showSheet(+b.dataset.s));

function sources(list) {
  if (!list.length) return "";
  return "<div class='meta'><b>Datasheet sources:</b> " + list.map(s =>
    `${esc(s.document_id)}: ` + (s.pages || []).slice(0, 8).map(p =>
      `<a href="#" onclick="showPage('${s.document_id}', ${p}); return false;">p. ${p}</a>`).join(", ")
  ).join(" &nbsp;|&nbsp; ") + "</div>";
}

function render(r) {
  const route = r.route.map(x => `<span class="tag">${esc(x)}</span>`).join("");
  const cypher = r.cypher.length ? `<details><summary>Queries (${r.cypher.length})</summary>` +
    r.cypher.map(c => `<pre>${esc(c)}</pre>`).join("") + "</details>" : "";
  const u = r.usage || {};
  $("out").innerHTML = `<div class="answer">${esc(r.text || "(no answer)")}</div>
    <div class="meta"><b>${esc(r.method)}</b> with <b>${esc(r.model_id)}</b> · outcome ${esc(r.outcome)} ·
      ${r.latency_s.toFixed(1)} s · ${u.prompt_tokens || 0}+${u.completion_tokens || 0} tokens ·
      ${(u.cost_usd || 0).toFixed(5)} USD (${u.n_cached || 0}/${u.n_calls || 0} calls from cache)</div>
    <div class="meta"><b>Route:</b> ${route || "-"}</div>${sources(r.sources)}${cypher}`;
}

async function ask() {
  const body = { question: $("q").value, method: $("method").value, model: $("model").value, answer_type: $("atype").value };
  if (!body.question.trim()) return;
  $("out").innerHTML = "<div class='meta'>Thinking…</div>";
  const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok) { $("out").innerHTML = `<div class='answer'>Error ${res.status}: ${esc(await res.text())}</div>`; return; }
  render(await res.json());
}
$("ask").onclick = ask;

async function init() {
  config = await (await fetch("/api/config")).json();
  $("model").innerHTML = Object.entries(config.models).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
  $("method").value = config.default.method; $("model").value = config.default.model;
  $("default").textContent = `Default: ${config.default.method} with ${config.models[config.default.model]} (${config.default.why}).`;
  const ex = await (await fetch("/api/examples")).json();
  const names = { a: "drawing only", b: "datasheet via tag", c: "drawing + datasheet", d: "not in the documents" };
  $("examples").innerHTML = ex.map((q, i) =>
    `<button data-i="${i}"><span class="fam">${q.family} · ${names[q.family]}</span> — ${esc(q.text)}</button>`).join("");
  $("examples").querySelectorAll("button").forEach(b => b.onclick = () => {
    const q = ex[+b.dataset.i]; $("q").value = q.text; $("atype").value = q.answer_type;
  });
  // ?q=...&method=...&model=...&type=...&page=doc:N : a kérdés betöltéskor (képernyőképekhez)
  const params = new URLSearchParams(location.search);
  if (params.get("q")) {
    $("q").value = params.get("q");
    if (params.get("method")) $("method").value = params.get("method");
    if (params.get("model")) $("model").value = params.get("model");
    if (params.get("type")) $("atype").value = params.get("type");
    await ask();
    const page = params.get("page");
    if (page) { const [doc, n] = page.split(":"); showPage(doc, +n); }
  }
}
init();
</script>
</body>
</html>
