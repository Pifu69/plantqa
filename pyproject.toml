[project]
name = "plantqa"
version = "0.1.0"
description = "Joint question answering over a P&ID and the datasheets of its tagged items"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Szabó Zsombor István" }, { name = "Kiszely Benedek" }]
dependencies = [
    "plantdocs[graph,app,extract,azure]",
    "plantgraph",
    "python-dotenv>=1.2.3",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-networkx",
    "httpx>=0.28.1",
]

[tool.uv.sources]
plantdocs = { path = "../plantdocs", editable = true }
plantgraph = { path = "../Thesis", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plantqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "UP042"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pydexpi", "pydexpi.*", "pymupdf", "fitz"]
follow_untyped_imports = true
implicit_reexport = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# a két forráscsomag nem ad ki py.typed jelzőt; a típusaikat így is követjük
module = ["plantgraph", "plantgraph.*", "plantdocs", "plantdocs.*"]
follow_untyped_imports = true
